<form id="searchForm" class="col-12 search-form mb-3" novalidate>
    <div class="input-group input-group-lg align-items-center">
        <input class="form-control search-input rounded border-primary pe-5" name="q" type="search" aria-label="搜索" placeholder="按 / 搜索">
        <button class="btn btn-sm btn-search position-absolute end-0 border-0 border-start border-secondary p-2" type="submit">
            <i class="fas fa-fw fa-search text-primary"></i>
        </button>
    </div>
    <div class="search-meta d-flex justify-content-between my-2 col-12">
        <span class="search-stat">
            <span id="searchStat"></span>
        </span>
        <span class="search-options">
            <a data-bs-toggle="collapse" href="#advanced-search" role="button" aria-expanded="false" aria-controls="advanced-search">高级</a>
        </span>
    </div>
    <div class="row g-1 collapse" id="advanced-search">
        <div class="form-floating col-6 mb-2">
            <select class="form-select" aria-label="语言" name="lang" id="languages-select">
                <option selected value="">全部</option>
                {{- range .Site.Languages -}}
                <option value="{{ .Lang }}">{{ .LanguageName }}</option>
                {{- end }}
            </select>
            <label for="languages-select">语言</label>
        </div>
        <div class="form-floating col-6 mb-2">
            <select class="form-select" aria-label="排序" name="sort" id="sorting-select">
                <option selected value="">评分</option>
                <option value="date asc">日期 ↑</option>
                <option value="date desc">日期 ↓</option>
            </select>
            <label for="sorting-select">排序</label>
        </div>
        <div class="form-floating col-6 col-lg-3">
            <input type="text" class="form-control form-control-sm" name="author" id="author-input" list="authors-list" placeholder="作者">
            <label for="author-input">作者</label>
            <datalist id="authors-list"></datalist>
        </div>
        <div class="form-floating col-6 col-lg-3">
            <input type="text" class="form-control form-control-sm" name="category" id="category-input" list="categories-list" placeholder="分类">
            <label for="category-input">分类</label>
            <datalist id="categories-list"></datalist>
        </div>
        <div class="form-floating col-6 col-lg-3">
            <input type="text" class="form-control form-control-sm" name="series" id="series-input" list="series-list" placeholder="专栏">
            <label for="series-input">专栏</label>
            <datalist id="series-list"></datalist>
        </div>
        <div class="form-floating col-6 col-lg-3">
            <input type="text" class="form-control form-control-sm" name="tag" id="tag-input" list="tags-list" placeholder="标签">
            <label for="tag-input">标签</label>
            <datalist id="tags-list"></datalist>
        </div>
    </div>
</form>
